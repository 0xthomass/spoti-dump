[package]
name = "spoti-dump"
version = "3.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.89"
axum = { version = "0.7.9", features = ["form", "query"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.13", features = ["derive"] }
csv = "1.3.0"
dotenvy = "0.15"
mime_guess = "2"
open = "5.3.0"
rand = "0.8.5"
reqwest = { version = "0.12.5", features = ["json"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
strsim = "0.11.1"
tiny_http = "0.12.0"
tokio = { version = "1.39.2", features = ["full"] }
url = "2.5.2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
ytmusicapi = "0.4.2"

[dev-dependencies]
tempfile = "3.23.0"
# `ServiceExt::oneshot` drives the axum `Router` in the HTTP-level integration
# tests without binding a TCP port. Response bodies are read with
# `axum::body::to_bytes`, so no extra body-util dependency is needed.
tower = { version = "0.5", features = ["util"] }
